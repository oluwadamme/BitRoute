services:
  postgres:
    image: postgres:17-alpine
    container_name: bitroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitroute
      POSTGRES_USER: bitroute
      POSTGRES_PASSWORD: bitroute
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitroute -d bitroute"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bitroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: bitroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitroute
      POSTGRES_USER: bitroute
      POSTGRES_PASSWORD: bitroute
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitroute -d bitroute"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bitroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitroute-api
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - src/BitRoute.Api/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=bitroute;Username=bitroute;Password=bitroute
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitroute-web
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:

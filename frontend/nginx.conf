# Only send `Connection: upgrade` when the client actually asked to upgrade.
# The previous config hardcoded it on every proxied request, which tells the
# upstream that a plain JSON GET is a protocol upgrade and defeats keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The API already returns compressed payloads; this covers the static build.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Vite emits content-hashed filenames under /assets, so those are safe to
    # cache indefinitely. index.html must never be cached or a deploy keeps
    # serving the old bundle references until the browser happens to revalidate.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy.
    #
    # NOTE: the app does not currently use this. It is built with
    # VITE_API_URL=http://localhost:5001 and calls the API cross-origin
    # straight from the browser, which works only because compose publishes
    # the API on the host and requires CORS to stay configured for
    # http://localhost:3000. Building with VITE_API_URL=/api instead would
    # route through here, drop the CORS requirement, and keep the API
    # unpublished. Left in place and corrected so that switch is a one-line
    # build-arg change.
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # SignalR telemetry hub.
    #
    # Long-lived connections need the read timeout raised well past the 60s
    # default, otherwise nginx tears down an idle WebSocket mid-journey and the
    # client reconnect-loops. Buffering must be off so pings are not held back.
    location /hubs/ {
        proxy_pass http://api:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
